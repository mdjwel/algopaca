<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap');
      text {
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F18"/>
      <stop offset="50%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#060A10"/>
    </linearGradient>

    <radialGradient id="bannerGlowLeft" cx="22%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bannerGlowRight" cx="82%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bannerGlowCenter" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="bannerBorderTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="titlePaca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2436"/>
      <stop offset="100%" stop-color="#0F1728"/>
    </linearGradient>

    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A28" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B101B" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="1320" height="760" fill="url(#bannerBg)"/>
  
  <!-- Atmospheric Glow Orbs -->
  <rect x="0" y="0" width="1320" height="760" fill="url(#bannerGlowLeft)"/>
  <rect x="0" y="0" width="1320" height="760" fill="url(#bannerGlowRight)"/>
  <rect x="0" y="0" width="1320" height="760" fill="url(#bannerGlowCenter)"/>

  <!-- High-Tech Background Chart Silhouette & Candlesticks -->
  <g opacity="0.14">
    <!-- Grid -->
    <line x1="80" y1="120" x2="1240" y2="120" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="80" y1="240" x2="1240" y2="240" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="80" y1="360" x2="1240" y2="360" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="80" y1="480" x2="1240" y2="480" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="80" y1="600" x2="1240" y2="600" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>

    <line x1="200" y1="80" x2="200" y2="680" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="440" y1="80" x2="440" y2="680" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="680" y1="80" x2="680" y2="680" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="920" y1="80" x2="920" y2="680" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="1160" y1="80" x2="1160" y2="680" stroke="#64748B" stroke-width="1" stroke-dasharray="4 8"/>

    <!-- Candlestick Series -->
    <line x1="780" y1="180" x2="780" y2="580" stroke="#34D399" stroke-width="2.5"/>
    <rect x="768" y="240" width="24" height="220" rx="4" fill="#34D399"/>

    <line x1="860" y1="140" x2="860" y2="540" stroke="#34D399" stroke-width="2.5"/>
    <rect x="848" y="190" width="24" height="190" rx="4" fill="#34D399"/>

    <line x1="940" y1="210" x2="940" y2="600" stroke="#F87171" stroke-width="2.5"/>
    <rect x="928" y="270" width="24" height="160" rx="4" fill="#F87171"/>

    <line x1="1020" y1="120" x2="1020" y2="510" stroke="#34D399" stroke-width="2.5"/>
    <rect x="1008" y="160" width="24" height="210" rx="4" fill="#34D399"/>

    <line x1="1100" y1="90" x2="1100" y2="460" stroke="#34D399" stroke-width="2.5"/>
    <rect x="1088" y="130" width="24" height="170" rx="4" fill="#34D399"/>

    <line x1="1180" y1="70" x2="1180" y2="400" stroke="#34D399" stroke-width="2.5"/>
    <rect x="1168" y="100" width="24" height="140" rx="4" fill="#34D399"/>
  </g>

  <!-- Left Side: Iconic Logo Mark Badge -->
  <g transform="translate(95, 195)" filter="url(#badgeShadow)">
    <!-- Container Badge -->
    <rect x="0" y="0" width="370" height="370" rx="82" fill="#111A28" stroke="url(#bannerBorder)" stroke-width="3"/>
    <rect x="0" y="0" width="370" height="370" rx="82" fill="url(#bannerGlowLeft)"/>
    <rect x="3" y="3" width="364" height="364" rx="79" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

    <!-- Scaled Mark -->
    <g transform="translate(22, 16) scale(0.66)">
      <!-- Back Ear -->
      <polygon points="195,190 190,95 235,160 230,205" fill="#78350F"/>
      <polygon points="190,95 218,140 195,190" fill="#92400E"/>
      <!-- Front Ear -->
      <polygon points="230,175 240,75 285,150 265,195" fill="#92400E"/>
      <polygon points="240,75 285,150 256,165" fill="#FEF08A"/>
      <polygon points="240,75 256,165 230,175" fill="#FBBF24"/>
      <!-- Crown -->
      <polygon points="195,190 230,175 265,195 250,225 205,220" fill="#FBBF24"/>
      <polygon points="230,175 265,195 285,180 255,168" fill="#FEF08A"/>
      <!-- Forehead & Snout -->
      <polygon points="265,195 335,215 285,250 250,225" fill="#FEF08A"/>
      <polygon points="335,215 385,238 348,272 285,250" fill="#FBBF24"/>
      <!-- Snout Tip -->
      <polygon points="385,238 410,256 385,282 348,272" fill="#92400E"/>
      <circle cx="399" cy="257" r="3.5" fill="#3FBF8F"/>
      <!-- Jaw -->
      <polygon points="385,282 348,272 315,310 350,318" fill="#451A03"/>
      <polygon points="348,272 285,250 315,310" fill="#78350F"/>
      <!-- Eye -->
      <polygon points="298,228 322,234 314,248 292,242" fill="#09131F"/>
      <polygon points="302,231 318,236 312,245 297,240" fill="#38BDF8"/>
      <circle cx="308" cy="238" r="5" fill="#FFFFFF"/>
      <circle cx="308" cy="238" r="2" fill="#67E8F9"/>
      <!-- Throat -->
      <polygon points="205,220 250,225 285,250 260,300 195,275" fill="#92400E"/>
      <!-- Pillars -->
      <polygon points="260,300 315,310 295,415 240,415" fill="#10B981"/>
      <polygon points="315,310 350,318 330,415 295,415" fill="#047857"/>
      <polygon points="195,275 260,300 240,415 175,415" fill="#F59E0B"/>
      <polygon points="150,320 195,275 175,415 130,415" fill="#78350F"/>
      <!-- Alpha Trend Line -->
      <path d="M 115 390 L 180 340 L 235 365 L 320 270 L 375 220 L 420 170" fill="none" stroke="#FDE047" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#markGlow)"/>
      <circle cx="180" cy="340" r="5" fill="#34D399" stroke="#064E3B" stroke-width="1.5"/>
      <circle cx="235" cy="365" r="5" fill="#38BDF8" stroke="#0C4A6E" stroke-width="1.5"/>
      <circle cx="320" cy="270" r="6" fill="#FBBF24" stroke="#78350F" stroke-width="1.5"/>
      <circle cx="420" cy="170" r="9" fill="#FEF08A" stroke="#B45309" stroke-width="2.5"/>
      <circle cx="420" cy="170" r="3.5" fill="#EA580C"/>
    </g>
  </g>

  <!-- Right Side: Brand Presentation & Quant Desk Details -->
  <g transform="translate(505, 145)">
    <!-- Eyebrow Badge & Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="36" rx="18" fill="url(#chipBg)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="5" fill="#10B981"/>
      <text x="34" y="23" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.14em" fill="#E2E8F0">
        ALPACA MARKETS · SIMULATED
      </text>

      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="165" height="36" rx="18" fill="url(#chipBg)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
        <circle cx="16" cy="18" r="4.5" fill="#34D399"/>
        <text x="30" y="23" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="0.10em" fill="#34D399">
          100% OPEN SOURCE
        </text>
      </g>
    </g>

    <!-- Main Title -->
    <text x="0" y="122" font-family="'Schibsted Grotesk', -apple-system, sans-serif" font-size="88" font-weight="800" letter-spacing="-0.035em">
      <tspan fill="#FFFFFF">Algo</tspan><tspan fill="url(#titlePaca)">Paca</tspan>
    </text>

    <!-- Main Tagline -->
    <text x="0" y="176" font-family="'Schibsted Grotesk', sans-serif" font-size="26" font-weight="600" fill="#F1F5F9" letter-spacing="-0.01em">
      Autonomous Quantitative Algorithmic Trading Desk
    </text>

    <!-- Sub-Tagline -->
    <text x="0" y="212" font-family="'IBM Plex Mono', monospace" font-size="14.5" font-weight="500" fill="#94A3B8" letter-spacing="0.03em">
      Multi-Modal AI Reasoning · Automated ATR Risk Guardrails · Backtest Suite
    </text>

    <!-- Feature Grid Pills (2 Rows x 3 Columns) -->
    <g transform="translate(0, 252)">
      <!-- Row 1 -->
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="230" height="44" rx="10" fill="url(#pillBg)" stroke="#334155" stroke-width="1.2"/>
        <text x="16" y="27.5" font-family="'IBM Plex Mono', monospace" font-size="13.5" font-weight="600" fill="#38BDF8">⚡ 5 Strategy Engines</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(245, 0)">
        <rect x="0" y="0" width="230" height="44" rx="10" fill="url(#pillBg)" stroke="#334155" stroke-width="1.2"/>
        <text x="16" y="27.5" font-family="'IBM Plex Mono', monospace" font-size="13.5" font-weight="600" fill="#FBBF24">🛡️ Risk Guardrails</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(490, 0)">
        <rect x="0" y="0" width="230" height="44" rx="10" fill="url(#pillBg)" stroke="#334155" stroke-width="1.2"/>
        <text x="16" y="27.5" font-family="'IBM Plex Mono', monospace" font-size="13.5" font-weight="600" fill="#34D399">🧪 Backtest Suite</text>
      </g>

      <!-- Row 2 -->
      <!-- Pill 4 -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="230" height="44" rx="10" fill="url(#pillBg)" stroke="#334155" stroke-width="1.2"/>
        <text x="16" y="27.5" font-family="'IBM Plex Mono', monospace" font-size="13.5" font-weight="600" fill="#C084FC">🤖 Multi-Modal AI</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(245, 56)">
        <rect x="0" y="0" width="230" height="44" rx="10" fill="url(#pillBg)" stroke="#334155" stroke-width="1.2"/>
        <text x="16" y="27.5" font-family="'IBM Plex Mono', monospace" font-size="13.5" font-weight="600" fill="#38BDF8">🌐 Modern Web Desk</text>
      </g>
      <!-- Pill 6 -->
      <g transform="translate(490, 56)">
        <rect x="0" y="0" width="230" height="44" rx="10" fill="url(#pillBg)" stroke="#334155" stroke-width="1.2"/>
        <text x="16" y="27.5" font-family="'IBM Plex Mono', monospace" font-size="13.5" font-weight="600" fill="#F472B6">📈 Paper &amp; Live Desk</text>
      </g>
    </g>

    <!-- Bottom Specs Strip -->
    <g transform="translate(0, 388)">
      <rect x="0" y="0" width="720" height="46" rx="10" fill="url(#terminalBg)" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="20" cy="23" r="4.5" fill="#EF4444"/>
      <circle cx="36" cy="23" r="4.5" fill="#F59E0B"/>
      <circle cx="52" cy="23" r="4.5" fill="#10B981"/>
      <text x="75" y="28" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#64748B">
        STACK: <tspan fill="#38BDF8">Python 3.10+</tspan> · <tspan fill="#FBBF24">FastAPI</tspan> · <tspan fill="#34D399">Alpaca-py</tspan> · <tspan fill="#C084FC">OpenAI/Gemini</tspan> · <tspan fill="#E2E8F0">Docker</tspan>
      </text>
    </g>
  </g>

  <!-- Top Subtle Border Highlight -->
  <line x1="0" y1="1" x2="1320" y2="1" stroke="url(#bannerBorderTop)" stroke-width="2"/>

  <!-- Bottom Border Line -->
  <line x1="0" y1="758" x2="1320" y2="758" stroke="url(#bannerBorder)" stroke-width="3"/>
</svg>
